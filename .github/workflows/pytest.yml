name: Pytest

# Minimal CI (see docs/decisions.md, "Minimal CI (pytest on pull
# requests)" and "CI push triggers added"). Purpose is only to catch
# broken tests before merging -- deliberately no deployment, Docker,
# cloud steps, or lint/format gates.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 matches the team's local environments. See
          # docs/decisions.md, "Python version alignment (CI and local)".
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
